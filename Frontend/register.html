<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CliniCore Intelligence · Register</title>
  <link rel="stylesheet" href="dashboard.css?v=4">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <img src="assets/ek-synergy-3d-mark.webp?v=2" alt="EK Synergy Ltd 3D circuit head logo" class="auth-logo">
      <h1>Create doctor test account</h1>
      <p class="muted">Public registration cannot create administrators.</p>
      <form id="registerForm">
        <input id="name" type="text" maxlength="80" placeholder="Full name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" required>
        <button id="registerButton" type="submit" class="primary">Register</button>
      </form>
      <p id="registerMessage" role="status" aria-live="polite"></p>
      <p><a href="login.html">Return to login</a></p>
    </div>
  </main>
  <script type="module">
    import AppAuth from './auth.js';

    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const button = document.getElementById('registerButton');
    const message = document.getElementById('registerMessage');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const displayName = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!displayName) {
        message.textContent = 'Please enter your full name.';
        return;
      }

      button.disabled = true;
      message.textContent = 'Creating account…';

      try {
        await AppAuth.register(email, password, displayName);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Registration failed', error);
        message.textContent = 'Registration failed: ' + (error.message || 'Please try again.');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
