<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CliniCore Intelligence · Register</title><link rel="stylesheet" href="dashboard.css"><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script></head><body><main class="auth-container"><div class="auth-card"><img src="assets/logo.jpg" alt="CliniCore Intelligence" class="auth-logo"><h1>Create doctor test account</h1><p class="muted">Public registration cannot create administrators.</p><form id="registerForm"><input id="name" type="text" maxlength="80" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><button type="submit" class="primary">Register</button></form><p><a href="login.html">Return to login</a></p></div></main><script type="module">import AppAuth from './auth.js';document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();try{await AppAuth.register(email.value,password.value,name.value.trim());location.href='dashboard.html'}catch(error){alert('Registration failed: '+error.message)}});</script></body></html>
